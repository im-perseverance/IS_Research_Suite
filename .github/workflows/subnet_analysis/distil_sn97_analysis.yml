name: Distil SN97 Analysis

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install bittensor

      - name: Run Distil SN97 analysis
        run: python distil_sn97_analysis.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/distil/
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Distil SN97 analysis ${DATE}" || echo "No changes to commit"
          git pull --rebase
          git push
