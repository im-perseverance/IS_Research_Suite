name: Chutes SN64 Analysis

on:
  schedule:
    - cron: '0 12 */14 * *'
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "bittensor<11"

      - name: Run Chutes SN64 analysis
        run: python chutes_sn64_analysis.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/chutes/
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Chutes SN64 analysis ${DATE}" || echo "No changes to commit"
          git pull --rebase
          git push
