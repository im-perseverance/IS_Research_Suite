name: Subnet Analysis
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install bittensor
          pip uninstall -y scalecodec
          pip install cyscale
      - name: Run snapshot
        run: python subnet_analysis.py
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subnet_analysis/
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Subnet analysis ${DATE}" || echo "No changes to commit"
          git pull --rebase
          git push