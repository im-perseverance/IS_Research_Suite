name: Validator Analysis

on:
  workflow_dispatch:
    inputs:
      netuid:
        description: 'Subnet ID to analyse'
        required: true
        type: number
      stake:
        description: 'Your intended stake in TAO'
        required: true
        type: number

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "bittensor<11"

      - name: Run validator analysis
        run: python validator_analysis.py --netuid ${{ github.event.inputs.netuid }} --stake ${{ github.event.inputs.stake }}

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add validator_analysis/
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "Validator analysis SN${{ github.event.inputs.netuid }} ${DATE}" || echo "No changes to commit"
          git pull --rebase
          git push
